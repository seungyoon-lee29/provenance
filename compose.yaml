x-runtime-environment: &runtime-environment
  APP_ENVIRONMENT: development
  APP_PUBLIC_ORIGIN: http://localhost:3000
  PROVIDER_BILLING_MODE: free_only
  LOCAL_PROVIDER_CREDENTIAL_MODE: contract_only
  IDENTITY_PERSISTENCE: postgres
  CREDENTIAL_VAULT_PROVIDER: disabled
  ENABLE_SYNTHETIC_PROVIDER: "false"
  ENABLE_LIVE_TRADING: "false"
  ENABLED_PAID_ADAPTERS: ""
  ENABLED_PAID_ROUTES: ""
  ENABLED_PAID_SCHEDULES: ""
  DATABASE_URL: postgresql://provenance:provenance@postgres:5432/provenance
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: provenance
      POSTGRES_USER: provenance
      POSTGRES_PASSWORD: provenance
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provenance -d provenance"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [runtime]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [runtime]

  migrate:
    build: .
    command: ["npm", "run", "db:migrate"]
    environment: *runtime-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks: [runtime]

  app:
    build: .
    command: ["npm", "start", "--", "--hostname", "0.0.0.0"]
    environment: *runtime-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [runtime]

  worker:
    build: .
    command: ["npm", "run", "worker:start"]
    environment:
      <<: *runtime-environment
      WORKER_HEALTH_PORT: "3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [runtime]

  app-ingress:
    profiles: [local]
    build: .
    command: ["npm", "exec", "--", "tsx", "scripts/tcp-forwarder.ts"]
    environment:
      FORWARD_LISTEN_PORT: "3000"
      FORWARD_TARGET_HOST: app
      FORWARD_TARGET_PORT: "3000"
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [ingress, runtime]

  worker-ingress:
    profiles: [local]
    build: .
    command: ["npm", "exec", "--", "tsx", "scripts/tcp-forwarder.ts"]
    environment:
      FORWARD_LISTEN_PORT: "3001"
      FORWARD_TARGET_HOST: worker
      FORWARD_TARGET_PORT: "3001"
    ports:
      - "127.0.0.1:${WORKER_HOST_PORT:-3001}:3001"
    depends_on:
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [ingress, runtime]

  network-off:
    profiles: [verify]
    build: .
    command: ["npm", "run", "verify:network-off"]
    environment:
      NETWORK_HARNESS_ALLOWED_ORIGINS: http://app:3000,http://worker:3001
    depends_on:
      app:
        condition: service_healthy
      worker:
        condition: service_healthy
    networks: [runtime]

  pr-check:
    profiles: [verify]
    build: .
    command: ["npm", "run", "check"]
    environment: *runtime-environment
    networks: [runtime]

  migration-smoke:
    profiles: [verify]
    build: .
    command: ["npm", "run", "verify:migrations"]
    environment: *runtime-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks: [runtime]

  persistence-integration:
    profiles: [verify]
    build: .
    command: ["npm", "run", "test:persistence-pg"]
    environment:
      <<: *runtime-environment
      PG_INTEGRATION: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks: [runtime]

  backup-drill:
    profiles: [verify]
    build: .
    command: ["npm", "run", "verify:backup-drill"]
    environment: *runtime-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks: [runtime]

networks:
  ingress:
  runtime:
    internal: true

# Stage 2 T2-a: without a named volume the ledger lives in the container layer
# and one `docker compose down` erases it — infra half of the persistence fix.
volumes:
  postgres-data:
