x-runtime-environment: &runtime-environment
  APP_ENVIRONMENT: development
  APP_PUBLIC_ORIGIN: http://localhost:3000
  PROVIDER_BILLING_MODE: free_only
  LOCAL_PROVIDER_CREDENTIAL_MODE: contract_only
  IDENTITY_PERSISTENCE: postgres
  CREDENTIAL_VAULT_PROVIDER: disabled
  ENABLE_SYNTHETIC_PROVIDER: "false"
  ENABLE_LIVE_TRADING: "false"
  ENABLED_PAID_ADAPTERS: ""
  ENABLED_PAID_ROUTES: ""
  ENABLED_PAID_SCHEDULES: ""
  DATABASE_URL: postgresql://provenance:provenance@postgres:5432/provenance
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: provenance
      POSTGRES_USER: provenance
      POSTGRES_PASSWORD: provenance
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provenance -d provenance"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [runtime]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [runtime]

  migrate:
    build: .
    command: ["npm", "run", "db:migrate"]
    environment: *runtime-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks: [runtime]

  app:
    build: .
    command: ["npm", "start", "--", "--hostname", "0.0.0.0"]
    environment: *runtime-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [runtime]

  worker:
    build: .
    command: ["npm", "run", "worker:start"]
    environment:
      <<: *runtime-environment
      WORKER_HEALTH_PORT: "3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [runtime]

  app-ingress:
    profiles: [local]
    build: .
    command: ["npm", "exec", "--", "tsx", "scripts/tcp-forwarder.ts"]
    environment:
      FORWARD_LISTEN_PORT: "3000"
      FORWARD_TARGET_HOST: app
      FORWARD_TARGET_PORT: "3000"
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [ingress, runtime]

  worker-ingress:
    profiles: [local]
    build: .
    command: ["npm", "exec", "--", "tsx", "scripts/tcp-forwarder.ts"]
    environment:
      FORWARD_LISTEN_PORT: "3001"
      FORWARD_TARGET_HOST: worker
      FORWARD_TARGET_PORT: "3001"
    ports:
      - "127.0.0.1:${WORKER_HOST_PORT:-3001}:3001"
    depends_on:
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [ingress, runtime]

  # The CLI/MCP surface (T10) runs on the HOST, not in a container, so the durable
  # commands (`paper open`, `paper account`) need a host-reachable database — and
  # `postgres` deliberately publishes no port. Without this the repo's own setup
  # contradicted itself: `compose:up` leaves postgres healthy while `db:migrate`
  # and `.env.example`'s 127.0.0.1:5432 both fail with ECONNREFUSED.
  # Same shape as the app/worker ingresses: loopback-only bind, `local` profile,
  # the existing generic forwarder — postgres itself stays off the host.
  postgres-ingress:
    profiles: [local]
    build: .
    command: ["npm", "exec", "--", "tsx", "scripts/tcp-forwarder.ts"]
    environment:
      FORWARD_LISTEN_PORT: "5432"
      FORWARD_TARGET_HOST: postgres
      FORWARD_TARGET_PORT: "5432"
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:net').connect(5432,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [ingress, runtime]

  network-off:
    profiles: [verify]
    build: .
    command: ["npm", "run", "verify:network-off"]
    environment:
      NETWORK_HARNESS_ALLOWED_ORIGINS: http://app:3000,http://worker:3001
    depends_on:
      app:
        condition: service_healthy
      worker:
        condition: service_healthy
    networks: [runtime]

  pr-check:
    profiles: [verify]
    build: .
    command: ["npm", "run", "check"]
    environment:
      <<: *runtime-environment
      # 이 이미지는 .dockerignore 로 .git 이 빠져 있어 release 스위트가 돌 수 없다.
      # 그 축소를 선언으로 남긴다 — 전에는 hasGit() 사본 3개가 조용히 skip 시켜서
      # 이 레인이 "npm run check 전부 통과" 로 읽혔다 (tests/release/git-lane.ts).
      RELEASE_LANE_WITHOUT_GIT: "1"
      # 같은 이유의 둘째 축소. `.dockerignore` 의 `.env.*` 는 credential 변수 36개를
      # 이미지에서 막는 보안 하한이라 뚫지 않는다 — .env.example 을 읽는 정합성 검사는
      # 호스트 레인이 돌고, 이 레인은 축소를 선언한다 (tests/host-database-endpoint.test.ts).
      CONFIG_LANE_WITHOUT_ENV_EXAMPLE: "1"
    networks: [runtime]

  migration-smoke:
    profiles: [verify]
    build: .
    command: ["npm", "run", "verify:migrations"]
    environment: *runtime-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks: [runtime]

  persistence-integration:
    profiles: [verify]
    build: .
    command: ["npm", "run", "test:persistence-pg"]
    environment:
      <<: *runtime-environment
      PG_INTEGRATION: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks: [runtime]

  backup-drill:
    profiles: [verify]
    build: .
    command: ["npm", "run", "verify:backup-drill"]
    environment: *runtime-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks: [runtime]

networks:
  ingress:
  runtime:
    internal: true

# Stage 2 T2-a: without a named volume the ledger lives in the container layer
# and one `docker compose down` erases it — infra half of the persistence fix.
volumes:
  postgres-data:
